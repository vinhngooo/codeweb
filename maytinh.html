<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Máy Tính</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        .calc {
            width: 220px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        #screen {
            width: 100%;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            padding: 5px;
            box-sizing: border-box;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        button {
            height: 40px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f9f9f9;
            border-radius: 4px;
        }
        button:active { background: #ddd; }
    </style>
</head>
<body>

<div class="calc">
    <input type="text" id="screen" value="0" disabled>
    <div class="btn-grid">
        <button onclick="clearScreen()">C</button>
        <button onclick="delLast()">DEL</button>
        <button onclick="press('/')">/</button>
        <button onclick="press('*')">*</button>
        
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('-')">-</button>
        
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('+')">+</button>
        
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="calc()" style="grid-row: span 2; height: 85px;">=</button>
        
        <button onclick="press('0')" style="grid-column: span 2;">0</button>
        <button onclick="press('.')">.</button>
    </div>
</div>

<script>
    const screen = document.getElementById('screen');

    function press(val) {
        if (screen.value === '0' || screen.value === 'Lỗi') screen.value = val;
        else screen.value += val;
    }

    function clearScreen() {
        screen.value = '0';
    }

    function delLast() {
        if (screen.value.length === 1 || screen.value === 'Lỗi') {
            screen.value = '0';
        } else {
            screen.value = screen.value.slice(0, -1);
        }
    }

    function calc() {
        try {
            screen.value = eval(screen.value);
        } catch {
            screen.value = 'Lỗi';
        }
    }
</script>

</body>
</html>
